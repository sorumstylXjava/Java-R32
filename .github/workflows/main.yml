name: Build Kernel Rosemary
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Kernel
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lld libssl-dev libelf-dev \
          ccache libncurses-dev git-lfs python2 python3 libncurses5

      - name: Eksekusi Script Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload Image.gz-dtb
        uses: actions/upload-artifact@v4
        with:
          name: Rosemary-Kernel-Image
          path: out/arch/arm64/boot/Image.gz-dtb

      - name: Upload DTB (Optional)
        uses: actions/upload-artifact@v4
        with:
          name: Rosemary-DTB
          path: out/arch/arm64/boot/dts/mediatek/*.dtb
